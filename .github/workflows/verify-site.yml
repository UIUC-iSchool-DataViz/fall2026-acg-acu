name: Verify Site Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1" # Jekyll 3.9 works well with Ruby 3.x
          bundler-cache: false

      - name: Install dependencies
        run: bundle install

      - name: Build Jekyll Site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: UIUC-iSchool-DataViz/fall2026-acg-acu

      - name: Verify Links (HTML Proofer)
        run: |
          bundle exec htmlproofer ./_site \
            --checks "Links,Images,Scripts,HtmlCheck" \
            --ignore-urls "/^http/,/^#/"
        # Note: --ignore-urls "/^http/" is used to focus on internal links first.
        # You can remove it later to check all external URLs as well.
